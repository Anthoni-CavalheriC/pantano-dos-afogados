<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Pântano dos Afogados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans+SC:wght@500;700;800&family=Barlow:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
<link rel="preload" href="img/fundo.jpg" as="image">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="triquetra" viewBox="0 0 100 100">
      <g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linejoin="round">
        <path d="M50 8 A56 56 0 0 0 13.6 71 A56 56 0 0 0 50 8 Z"/>
        <path d="M13.6 71 A56 56 0 0 0 86.4 71 A56 56 0 0 0 13.6 71 Z"/>
        <path d="M86.4 71 A56 56 0 0 0 50 8 A56 56 0 0 0 86.4 71 Z"/>
        <circle cx="50" cy="54" r="20"/>
      </g>
    </symbol>
  </defs>
</svg>

<!-- Tela 1: nome -->
<section id="tela-nome" class="tela tela-nome com-moldura">
  <header class="topo">
    <p class="sobre">Ballynyr · Irlanda, ano 890</p>
    <h1>O Pântano dos Afogados</h1>
    <div class="divisor" aria-hidden="true"><svg><use href="#triquetra"/></svg></div>
  </header>
  <form id="form-nome" class="cartao-nome moldura" autocomplete="off">
    <h2 class="rotulo"><span>Quem chega à vila?</span></h2>
    <label for="campo-nome">Qual é o seu nome?</label>
    <input id="campo-nome" type="text" maxlength="40" placeholder="Digite seu nome">
    <button id="botao-nome" class="botao" type="submit" disabled>Esse é meu nome</button>
  </form>
</section>

<!-- Tela 2: escolha (página única, sem rolagem) -->
<section id="tela-escolha" class="tela tela-escolha com-moldura" hidden>
  <header class="barra">
    <div class="barra-titulo">
      <p class="sobre">Ballynyr · Irlanda, ano 890</p>
      <h1>O Pântano dos Afogados</h1>
    </div>
    <p id="barra-ola" class="barra-ola">Olá, <strong id="nome-jogador"></strong> — escolha seu personagem.
      <button id="botao-trocar-nome" class="link" type="button">Trocar nome</button></p>
    <!-- Modo mestre: resumo de quem escolheu -->
    <div id="resumo-mestre" class="resumo-mestre" hidden>
      <p class="mestre-selo">Modo mestre</p>
      <p id="mestre-contagem" class="mestre-contagem"></p>
      <p id="mestre-faltam" class="mestre-faltam"></p>
    </div>
  </header>
  <div id="faixa" class="faixa"></div>
</section>

<!-- Tela 3: ficha em tela cheia -->
<section id="tela-ficha" class="tela tela-ficha com-moldura" hidden>
  <!-- A ardósia e a moldura cobrem a janela; a ficha é montada em HTML dentro do palco (ficha.js). -->
  <div id="palco" class="palco" aria-live="polite"></div>

  <button id="botao-voltar" class="ctl voltar" type="button">← Personagens</button>
  <div class="abas" role="tablist">
    <button id="aba-ficha" class="ctl aba" role="tab" type="button">Ficha</button>
    <button id="aba-historia" class="ctl aba" role="tab" type="button">História</button>
  </div>

  <div id="acao" class="acao">
    <p id="ficha-status" class="status"></p>
    <p id="ficha-erro" class="erro" hidden></p>
    <button id="botao-jogar" class="botao jogar" type="button"></button>
    <button id="botao-cancelar" class="link" type="button" hidden>Cancelar</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="personagens.js"></script>
<script src="fichas.js"></script>
<script src="ficha.js"></script>
<script src="app.js"></script>
</body>
</html>
